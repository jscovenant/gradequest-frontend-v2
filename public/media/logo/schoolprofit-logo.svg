<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="spNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="spEmeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="spGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="spShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F2744" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ICON BADGE -->
  <g transform="translate(15, 10)" filter="url(#spShadow)">
    <!-- Shield Container -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#spNavyGrad)" />
    
    <!-- Academic Open Book Foundation -->
    <path d="M22 68 C35 63, 45 65, 50 71 C55 65, 65 63, 78 68 L78 74 C65 69, 55 71, 50 77 C45 71, 35 69, 22 74 Z" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Financial Growth Bars rising out of the Book -->
    <!-- Bar 1 (Left) -->
    <rect x="30" y="48" width="9" height="18" rx="4" fill="url(#spGoldGrad)" />
    <!-- Bar 2 (Middle) -->
    <rect x="44" y="36" width="9" height="30" rx="4" fill="#60A5FA" />
    <!-- Bar 3 (Right - Highest) -->
    <rect x="58" y="24" width="9" height="42" rx="4" fill="url(#spEmeraldGrad)" />
    
    <!-- Dynamic Upward Profit Arrow / Graduation Tassel -->
    <path d="M42 22 L72 16 L66 42" stroke="url(#spGoldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="72" cy="16" r="4.5" fill="#FBBF24" />
  </g>

  <!-- LOGO TEXT -->
  <!-- "School" in Navy Bold -->
  <text x="135" y="68" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="44" fill="#0F2744" letter-spacing="-0.03em">
    School<tspan fill="#059669">Profit</tspan>
  </text>

  <!-- Tagline Badge -->
  <rect x="138" y="80" width="280" height="22" rx="6" fill="#F1F5F9" />
  <text x="146" y="95" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="11.5" fill="#475569" letter-spacing="0.08em">
    GROWTH &amp; PROFIT OPERATING SYSTEM
  </text>
  
  <!-- Subtle Dot Accent -->
  <circle cx="428" cy="91" r="3.5" fill="#10B981" />
</svg>
